<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Diagnostic Deriv</title></head>
<body style="font-family:monospace;padding:16px;background:#0b0e14;color:#9fe8c8;font-size:13px;line-height:2">
<h3 style="color:#fff">🩺 Diagnostic connexion Deriv</h3><div id="out">Test en cours…</div>
<script>
const EPS=['wss://ws.derivws.com/websockets/v3?app_id=1089','wss://ws.derivws.com/websockets/v3?app_id=36300','wss://ws.derivws.com/websockets/v3?app_id=16929','wss://ws.derivws.com/websockets/v3?app_id=1180','wss://ws.binaryws.com/websockets/v3?app_id=1089'];
const out=document.getElementById('out');
function line(t){out.innerHTML+='<div>'+t+'</div>';}
(async()=>{
  out.innerHTML='';
  try{await fetch('https://deriv.com',{mode:'no-cors'});line('🌐 Réseau vers deriv.com : OK');}catch(e){line('🌐 Réseau vers deriv.com : BLOQUÉ');}
  for(const u of EPS){
    const r=await new Promise(res=>{let ws,done=false;try{ws=new WebSocket(u)}catch(e){res('err');return;}
      const t=setTimeout(()=>{if(!done){done=true;res('timeout')}},7000);
      ws.onopen=()=>{if(!done){done=true;clearTimeout(t);res('ok')}};ws.onerror=()=>{if(!done){done=true;clearTimeout(t);res('err')}};});
    line((r==='ok'?'✔ ouvert : ':'✖ refusé : ')+u.replace('wss://','').replace('/websockets/v3',''));
  }
  line('Diagnostic terminé.');
})();
</script></body></html>
